<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Private Portal</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #0b1020;
      color: white;
      font-family: Arial, sans-serif;
    }

    #login {
      min-height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 3px;
    }

    .panel {
      width: 100%;
      max-width: 380px;
      padding: 32px;
      text-align: center;
      background: #151d30;
      border: 1px solid #293750;
      border-radius: 18px;
    }

    h1 {
      margin-top: 0;
    }

    p {
      color: #aab7cf;
    }

    input, button {
      width: 100%;
      padding: 3px;
      margin-top: 12px;
      border-radius: 9px;
      font-size: 16px;
    }

    input {
      background: #0b1020;
      border: 1px solid #34435d;
      color: white;
    }

    button {
      border: none;
      background: #647bff;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #8091ff;
    }

    #error {
      color: #ff8b96;
      min-height: 20px;
    }

    #portal {
      display: none;
      width: 100%;
      height: 100%;
    }

    #toolbar {
      height: 42px;
      padding: 5px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #151d30;
    }

    #toolbar button {
      width: auto;
      margin: 0;
      padding: 6px 12px;
      font-size: 13px;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100% - 42px);
      border: none;
      background: #111;
    }
  </style>
</head>

<body>
  <main id="login">
    <form class="panel" id="loginForm">
      <h1>Learning Website</h1>
      <p>Enter your password to continue.</p>

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Unlock</button>
      <p id="error" role="status"></p>
    </form>
  </main>

  <section id="portal">
    <header id="toolbar">
      <strong>Private Portal</strong>
      <button id="lockButton" type="button">Lock</button>
    </header>

    <iframe
      id="game"
      title="Selenite"
      allow="fullscreen; gamepad"
      allowfullscreen
    ></iframe>
  </section>

  <script>
    const PASSWORD = "nolearn";

    const login = document.getElementById("login");
    const portal = document.getElementById("portal");
    const form = document.getElementById("loginForm");
    const password = document.getElementById("password");
    const error = document.getElementById("error");
    const game = document.getElementById("game");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      if (password.value === PASSWORD) {
        login.style.display = "none";
        portal.style.display = "block";
        error.textContent = "";
        password.value = "";

        if (!game.src) {
          game.src = "https://selenite.cc/";
        }
      } else {
        error.textContent = "Incorrect password. Try again.";
        password.value = "";
      }
    });

    document.getElementById("lockButton")
      .addEventListener("click", function() {
        game.src = "about:blank";
        portal.style.display = "none";
        login.style.display = "flex";
        password.focus();
      });
  </script>
</body>
</html>
